# Блок для лендинга IGRAI 2 по адресу /igrai2/
#
# Вставляется в /etc/nginx/sites-available/igrai перед строкой "location / {".
# Это делает deploy/deploy.sh — вручную копировать не нужно.
#
# Зачем: корень того server-блока — /var/www/igrai (старый лендинг), поэтому
# /igrai2/ по умолчанию уходит в /var/www/igrai/igrai2/, которого нет, и
# try_files отдаёт чужой index.html. Здесь мы говорим "для /igrai2/ корень
# другой — /var/www", и путь складывается в /var/www/igrai2/.
#
# ^~ важен: он запрещает nginx проверять regex-локации, иначе картинки и
# шрифты перехватил бы блок с кэшем и стал бы искать их от корня /var/www/igrai.
# Ровно так же сделано для соседнего сайта /1comp/.

location = /igrai2 {
    return 301 /igrai2/;
}

location ^~ /igrai2/ {
    root /var/www;
    index index.html;
    try_files $uri $uri/ /igrai2/index.html;

    location ~* ^/igrai2/.*\.(?:jpg|jpeg|png|webp|svg|ico|woff2?)$ {
        root /var/www;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /igrai2/index.html {
        root /var/www;
        add_header Cache-Control "no-cache";
    }
}
